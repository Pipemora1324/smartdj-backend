services:
  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    depends_on: [backend]
    networks: [smartdj]
  backend:
    build: ./backend
    ports: ["3000:3000"]
    env_file: .env
    environment:
      AI_GRPC_URL: ai:50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    networks: [smartdj]
  ai:
    build: ./ai
    environment:
      AI_GRPC_PORT: "50051"
    ports: ["50051:50051"]
    networks: [smartdj]
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data, ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro, ./database/migrations/001_verificacion_por_codigo.sql:/docker-entrypoint-initdb.d/02-verificacion.sql:ro, ./database/migrations/002_supabase_auth.sql:/docker-entrypoint-initdb.d/03-supabase-auth.sql:ro, ./database/migrations/003_esquema_base.sql:/docker-entrypoint-initdb.d/04-esquema-base.sql:ro, ./database/migrations/004_canciones_buscador.sql:/docker-entrypoint-initdb.d/05-canciones-buscador.sql:ro, ./database/migrations/005_panel_dueno.sql:/docker-entrypoint-initdb.d/06-panel-dueno.sql:ro, ./database/migrations/006_emisora.sql:/docker-entrypoint-initdb.d/07-emisora.sql:ro, ./database/migrations/007_rls_tablas_existentes.sql:/docker-entrypoint-initdb.d/08-rls.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdj -d smartdj"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [smartdj]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [smartdj]
volumes:
  postgres_data:
  redis_data:
networks:
  smartdj:
