Eservices:
  gateway:
    build: ./gateway
    ports: ["8080:80"]
    depends_on: [frontend, backend]
    networks: [smartdj]
  frontend:
    build: ./frontend
    networks: [smartdj]
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    networks: [smartdj]
  ai:
    build: ./ai
    networks: [smartdj]
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data, ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdj -d smartdj"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [smartdj]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [smartdj]
volumes:
  postgres_data:
  redis_data:
networks:
  smartdj:
